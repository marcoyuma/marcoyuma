name: profile-stats
 
on:
  schedule:
    - cron: "0 21 * * *" # 04:00 WIB setiap hari
  workflow_dispatch:
  push:
    branches: [main]
 
permissions:
  contents: write
 
concurrency:
  group: profile-stats
  cancel-in-progress: true
 
env:
  # Palet dark: teks utama, teks sekunder, ikon, ring
  DARK: "bg_color=00000000&hide_border=true&title_color=e6edf3&text_color=8b949e&icon_color=6e7681&ring_color=58a6ff&disable_animations=true"
  # Palet light: mengikuti token warna GitHub light
  LIGHT: "bg_color=00000000&hide_border=true&title_color=1f2328&text_color=59636e&icon_color=818b98&ring_color=0969da&disable_animations=true"
  # Opsi kartu statistik
  STATS: "show_icons=true&hide_title=true&hide=issues&rank_icon=percentile&include_all_commits=true&card_width=430"
  # Opsi kartu bahasa. Tambahkan &hide=plpgsql bila migrasi Supabase mendominasi.
  LANGS: "layout=compact&hide_title=true&langs_count=6&card_width=320&size_weight=0.5&count_weight=0.5"
 
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
 
      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS }}&${{ env.DARK }}
          path: assets/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS }}&${{ env.LIGHT }}
          path: assets/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LANGS }}&${{ env.DARK }}
          path: assets/langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LANGS }}&${{ env.LIGHT }}
          path: assets/langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh profile stats"
          git push
 
